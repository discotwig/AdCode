app = "adcode"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1

# Mount a persistent volume so state files survive redeploys.
# Create with: flyctl volumes create adcode_data --size 1 --region iad
[[mounts]]
  source = "adcode_data"
  destination = "/app/customers"
