# fly.toml app configuration file for the example mailroom deployment
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'adcode-mailroom-example'
primary_region = 'iad'

[build]
  dockerfile = 'integrations/email_mailroom/Dockerfile'

[env]
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
